# Local Postgres for manual use and for TEST_DATABASE_URL:
#   docker compose up -d
#   TEST_DATABASE_URL=postgresql://zero_audit:zero_audit@localhost:5432/zero_audit_test pnpm test
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: zero_audit
      POSTGRES_PASSWORD: zero_audit
      POSTGRES_DB: zero_audit_test
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'zero_audit', '-d', 'zero_audit_test']
      interval: 5s
      timeout: 5s
      retries: 10
